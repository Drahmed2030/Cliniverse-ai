workflows:
  ios-workflow:
    name: Cliniverse AI iOS
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cliniverse.ai
      node: 20.17.0
      xcode: latest
      cocoapods: default
      groups:
        - app_store
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor
        script: npm install @capacitor/core@5.7.0 @capacitor/ios@5.7.0 @capacitor/cli@5.7.0
      - name: Build Next.js
        script: npm run build
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Copy web assets
        script: npx cap copy ios
      - name: Show iOS structure
        script: find ios -name "*.xcodeproj" -o -name "Podfile" 2>/dev/null | head -20
      - name: CocoaPods
        script: |
          cd ios/App
          XCPROJ=$(find . -name "*.xcodeproj" -maxdepth 3 | head -1)
          if [ -z "$XCPROJ" ]; then
            echo "No xcodeproj found — running xcodegen or cap sync"
            cd ../..
            npx cap update ios
            cd ios/App
          fi
          pod install --repo-update
      - name: Build IPA
        script: xcode-project use-profiles && xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: true
      email:
        recipients:
          - ahmyohmed121@gmail.com
        notify:
          success: true
          failure: true
