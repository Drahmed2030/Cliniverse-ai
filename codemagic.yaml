workflows:
  ios-workflow:
    name: Cliniverse AI iOS
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cliniverse.ai
      node: 20.17.0
      xcode: latest
      cocoapods: default
      groups:
        - app_store
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor
        script: npm install @capacitor/core@5.7.0 @capacitor/ios@5.7.0 @capacitor/cli@5.7.0
      - name: Build Next.js
        script: npm run build
      - name: Capacitor Add and Sync
        script: |
          npx cap add ios 2>/dev/null || true
          npx cap copy ios 2>/dev/null || true
      - name: CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
          echo "=== xcworkspace files ==="
          find . -name "*.xcworkspace" | head -10
          find . -name "*.xcodeproj" | head -10
      - name: Build IPA
        script: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | grep -v xcodeproj | head -1)
          echo "Using workspace: $WORKSPACE"
          xcode-project use-profiles
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: true
      email:
        recipients:
          - ahmyohmed121@gmail.com
        notify:
          success: true
          failure: true
