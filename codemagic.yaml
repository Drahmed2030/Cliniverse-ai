workflows:
  ios-workflow:
    name: Cliniverse AI iOS
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cliniverse.ai
      node: 20.17.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor
        script: npm install @capacitor/core@5.7.0 @capacitor/ios@5.7.0 @capacitor/cli@5.7.0 && npx cap init CliniverseAI com.cliniverse.ai --web-dir=out
      - name: Build Next.js
        script: npm run build
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Fix Podfile
        script: python3 fix_podfile.py
      - name: Sync iOS
        script: npx cap copy ios
      - name: CocoaPods
        script: cd ios/App && pod install
      - name: Build IPA
        script: xcode-project use-profiles && xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: PCS2Z3DSTK
        issuer_id: b5fb5ccc-6a9e-4ef6-9e44-6ec1bcfe37b4
        submit_to_testflight: false
        submit_to_app_store: true
      email:
        recipients:
          - ahmyohmed121@gmail.com
        notify:
          success: true
          failure: true
