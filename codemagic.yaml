workflows:
  ios-workflow:
    name: Cliniverse AI iOS
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cliniverse.ai
      node: 22.14.0
      xcode: 26.6
      cocoapods: default
      groups:
        - app_store
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build Next.js
        script: npm run build
      - name: Verify canonical RC web origin
        script: |
          EXPECTED_COMMIT="${CM_COMMIT:?Codemagic CM_COMMIT is required}"
          node scripts/verify-native-release-origin.mjs "https://www.cliniverseai.com/api/release-contract" "$EXPECTED_COMMIT"
      - name: Capacitor Add and Sync
        script: |
          rm -rf ios
          npx cap add ios
          npx cap copy ios
          test -f ios/App/App/public/native-offline.html
      - name: Install native cold-launch guard
        script: |
          node scripts/configure-ios-launch-guard.mjs
          grep -q 'CliniverseBridgeViewController' ios/App/App/AppDelegate.swift
          grep -q 'customClass="CliniverseBridgeViewController"' ios/App/App/Base.lproj/Main.storyboard
      - name: Generate branded iOS assets
        script: |
          node scripts/sync-brand-icons.mjs
          EXPECTED_ICON_SOURCE_SHA256="80f5ca80668ce7d95b5853cffee1a6c32e31d28974a1e4cff115498b5ea7bf09"
          ACTUAL_ICON_SOURCE_SHA256="$(shasum -a 256 assets/logo.svg | awk '{print $1}')"
          test "$ACTUAL_ICON_SOURCE_SHA256" = "$EXPECTED_ICON_SOURCE_SHA256"
          npx --no-install capacitor-assets generate --ios --assetPath assets --iconBackgroundColor '#080C16' --iconBackgroundColorDark '#080C16' --splashBackgroundColor '#080C16' --splashBackgroundColorDark '#080C16' --logoSplashTargetWidth 960
          ICON_PATH="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          SPLASH_PATH="ios/App/App/Assets.xcassets/Splash.imageset/Default@3x~universal~anyany.png"
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          test -f "$ICON_PATH"
          test -f "$SPLASH_PATH"
          test "$(sips -g pixelWidth "$ICON_PATH" | awk '/pixelWidth/{print $2}')" = "1024"
          test "$(sips -g pixelHeight "$ICON_PATH" | awk '/pixelHeight/{print $2}')" = "1024"
          test "$(sips -g hasAlpha "$ICON_PATH" | awk '/hasAlpha/{print $2}')" = "no"
      - name: Inject approved privacy manifest
        script: |
          PRIVACY_SOURCE="native/privacy/PrivacyInfo.xcprivacy"
          PRIVACY_TARGET="ios/App/App/PrivacyInfo.xcprivacy"
          test -f "$PRIVACY_SOURCE" || { echo "RC BLOCKED: $PRIVACY_SOURCE is missing."; exit 1; }
          cp "$PRIVACY_SOURCE" "$PRIVACY_TARGET"
          plutil -lint "$PRIVACY_TARGET"
          ruby scripts/inject-ios-privacy-manifest.rb
      - name: Configure release Info.plist
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Cliniverse AI" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Cliniverse AI" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CliniverseLaunchGuardVersion string 1" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :CliniverseLaunchGuardVersion 1" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CliniverseIconSourceSHA256 string 80f5ca80668ce7d95b5853cffee1a6c32e31d28974a1e4cff115498b5ea7bf09" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :CliniverseIconSourceSHA256 80f5ca80668ce7d95b5853cffee1a6c32e31d28974a1e4cff115498b5ea7bf09" ios/App/App/Info.plist
          IOS_BUILD_NUMBER="${BUILD_NUMBER:?Codemagic BUILD_NUMBER is required}"
          case "$IOS_BUILD_NUMBER" in (*[!0-9]*|'') echo "RC BLOCKED: BUILD_NUMBER must be numeric"; exit 1;; esac
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $IOS_BUILD_NUMBER" ios/App/App/Info.plist
      - name: CocoaPods
        script: cd ios/App && pod install --repo-update
      - name: Build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
      - name: RC package verification
        script: |
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -n 1)"
          bash scripts/verify-ios-ipa.sh "$IPA_PATH"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Release integration builds must never auto-submit to Apple.
        # Enable TestFlight/App Store publishing only from an explicitly approved RC workflow.
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - ahmyohmed121@gmail.com
        notify:
          success: true
          failure: true

