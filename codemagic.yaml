workflows:
  ios-workflow:
    name: Cliniverse AI iOS
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cliniverse.ai
      node: 20.17.0
      xcode: latest
      cocoapods: default
      groups:
        - app_store
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor
        script: npm install @capacitor/core@5.7.0 @capacitor/ios@5.7.0 @capacitor/cli@5.7.0
      - name: Build Next.js
        script: npm run build
      - name: Capacitor Add and Sync
        script: |
          rm -rf ios
          npx cap add ios
          npx cap copy ios
      - name: Add PrivacyInfo to frameworks
        script: |
          PRIVACY_CONTENT='<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>NSPrivacyAccessedAPITypes</key><array/><key>NSPrivacyCollectedDataTypes</key><array/><key>NSPrivacyTracking</key><false/><key>NSPrivacyTrackingDomains</key><array/></dict></plist>'
          mkdir -p ios/App/App
          echo $PRIVACY_CONTENT > ios/App/App/PrivacyInfo.xcprivacy
          find ios -name "Capacitor.framework" -type d 2>/dev/null | while read d; do echo $PRIVACY_CONTENT > "$d/PrivacyInfo.xcprivacy"; done
          find ios -name "Cordova.framework" -type d 2>/dev/null | while read d; do echo $PRIVACY_CONTENT > "$d/PrivacyInfo.xcprivacy"; done
          find ios -name "PrivacyInfo.xcprivacy" | head -10
      - name: Set build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 4" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 4" ios/App/App/Info.plist
      - name: CocoaPods
        script: cd ios/App && pod install --repo-update
      - name: Build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: true
      email:
        recipients:
          - ahmyohmed121@gmail.com
        notify:
          success: true
          failure: true
