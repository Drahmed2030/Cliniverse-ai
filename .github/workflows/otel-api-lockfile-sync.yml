name: OpenTelemetry API lockfile sync

on:
  push:
    branches:
      - integration/auth-release-shell-v1
    paths:
      - .github/workflows/otel-api-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync-otel-api-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integration/auth-release-shell-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate reproducible OpenTelemetry API package lock
        run: npm install --save-exact --package-lock-only --ignore-scripts @opentelemetry/api@1.9.1

      - name: Verify lockfile installs without scripts
        run: npm ci --ignore-scripts

      - name: Commit generated package metadata
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No package metadata changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore(observability): lock OpenTelemetry API 1.9.1'
          git push origin HEAD:integration/auth-release-shell-v1
