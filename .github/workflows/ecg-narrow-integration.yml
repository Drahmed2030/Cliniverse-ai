name: ECG narrow integration

on:
  pull_request:
    branches: [strategy/commercial-activation-v1, integration/ecg-record10-account-evidence-v1, integration/ecg-atomic-account-save-v1]
    paths:
      - 'app/labs/ecg-account-review/**'
      - 'app/api/ecg-review-attempt/**'
      - 'tools/ecg-rebuild/**'
      - 'tsconfig.json'
      - 'app/lib/clinicalIntelligence/**'
      - 'app/lib/governance/**'
      - 'app/lib/competency/**'
      - 'tests/ecg-*.test.mjs'
      - 'tests/xapi-export.test.mjs'
      - 'app/lib/learningExport/**'
      - 'app/api/learning-export/**'
      - 'app/components/release/AssessmentHistory.tsx'
      - 'app/components/release/EcgSavedHistory.tsx'
      - 'app/supabase.ts'
      - 'tests/fixtures/ecgEligibility.mjs'
      - 'supabase/drafts/ecg_account_atomic_v1.sql'
      - 'tools/echo-db-tests/ecg-atomic.test.mjs'
      - '.github/workflows/ecg-narrow-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-and-account-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/echo-db-tests
      - name: ECG, Echo and account regression tests
        run: node --test tests/ecg-review-api.test.mjs tests/ecg-record10-reviewed-pdf-binding.test.mjs tests/ecg-approved-rubric.test.mjs tests/ecg-reviewed-pdf-identity.test.mjs tests/ecg-answer-submission.test.mjs tests/xapi-export.test.mjs tests/ecg-eligibility-decision.test.mjs tests/ecg-record-10-evidence-ledger-binding.test.mjs tests/ecg-account-attempt.test.mjs tests/echo-account-history.test.mjs tests/echo-account-attempt.test.mjs tests/echo-account-events.test.mjs tests/lesson-completion.test.mjs tools/echo-db-tests/schema.test.mjs tools/echo-db-tests/ecg-atomic.test.mjs
      - run: npx tsc --noEmit
      - name: Targeted lint
        run: npx eslint app/components/release/EcgSavedHistory.tsx app/api/ecg-review-attempt/route.ts app/lib/clinicalIntelligence/ecgRecord10ReviewedPdfBinding.ts app/lib/competency/ecgRecord10ApprovedRubric.ts app/lib/competency/ecgRecord10Question.ts app/labs/ecg-account-review app/lib/clinicalIntelligence/ecgReviewedPdfIdentity.ts app/lib/competency/ecgAnswerSubmission.ts app/lib/clinicalIntelligence/ecgEligibilityDecision.ts app/lib/clinicalIntelligence/ecgRecord10EvidenceLedgerBinding.ts app/lib/competency/ecgGovernedAccountAttempt.ts app/lib/competency/ecgAtomicAccountSave.ts app/lib/learningExport app/api/learning-export/route.ts app/components/release/AssessmentHistory.tsx
