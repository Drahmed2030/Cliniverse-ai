name: Release contracts

on:
  pull_request:
    branches:
      - ux/confusion-reduction-v1
      - release/apple-launch-stability
      - main
  push:
    branches:
      - integration/auth-release-shell-v1

permissions:
  contents: read

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release security contracts
        run: npm test
